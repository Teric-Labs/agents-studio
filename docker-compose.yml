services:
  phosai-agents-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phosai-agents-studio
    ports:
      - "80:80"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      VITE_API_BASE: https://backend.atekervoices.com
    networks:
      - phosai-agents-studio-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  phosai-agents-studio-network:
    driver: bridge